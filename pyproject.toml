[project]
name = "hotpath"
version = "0.2.0"
description = "Profile llama.cpp-family GPU inference, run controlled experiments, and keep the evidence."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []
keywords = ["llama.cpp", "inference", "profiling", "benchmark", "cuda", "gguf"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]

[project.optional-dependencies]
# full JSON Schema validation of outputs in request-shape experiments; without it only the schema's required
# top-level keys are checked and records say so
schema = ["jsonschema>=4.18"]

[project.scripts]
hotpath = "hotpath.cli:main"
hotpath-mcp = "hotpath.mcp_server:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hotpath"]
